<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HCMUTE Online Student Portal Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>

  <script>
    const emptyStudent = {
      id: "",
      name: "Chưa tải dữ liệu",
      type: "SV/HV/NCS",
      status: "Chưa cập nhật",
      major: "Chưa cập nhật",
      className: "Chưa cập nhật",
      program: "Chưa cập nhật",
      course: "Chưa cập nhật",
      birthDate: "Chưa cập nhật",
      birthPlace: "Chưa cập nhật",
      gender: "Chưa cập nhật",
      citizenId: "Chưa cập nhật",
      ethnicity: "Chưa cập nhật",
      religion: "Chưa cập nhật",
      phone: "Chưa cập nhật",
      email: "Chưa cập nhật",
      address: "Chưa cập nhật",
      emergencyContact: "Chưa cập nhật",
      imageUrl: "",
      gpa: "Chưa cập nhật",
      credits: 0,
      requiredCredits: 0,
      currentCredits: 0,
      warning: "",
      note: ""
    };
    let student = { ...emptyStudent };

    let notifications = [];
    let activeNotificationTab = "general";

    let curriculumRows = [
      { code: "ADNT330580E", name: "Advanced Networking Technology", credits: 3, type: "Bắt buộc", term: 1, prereq: "Data communications; Networking Essentials" },
      { code: "AMHC333179E", name: "Agile methods (2+1)", credits: 3, type: "Bắt buộc", term: 1, prereq: "Software Engineering" },
      { code: "BCAP433280", name: "Blockchain và ứng dụng", credits: 3, type: "Bắt buộc", term: 1, prereq: "Data Structures and Algorithms" },
      { code: "BDES333877E", name: "Big Data Essentials", credits: 3, type: "Bắt buộc", term: 1, prereq: "Database management system" },
      { code: "ADDB331784E", name: "Advanced Database", credits: 3, type: "Tự chọn", term: "", prereq: "Database management system" },
      { code: "AIOT331185E", name: "Artificial Intelligence for IoT", credits: 3, type: "Tự chọn", term: "", prereq: "Artificial Intelligence; Internet of Things" },
      { code: "DAWH430784E", name: "Data Warehouse", credits: 3, type: "Tự chọn", term: "", prereq: "Database management system" },
      { code: "INRE431084E", name: "Information Retrieval", credits: 3, type: "Tự chọn", term: "", prereq: "Data Structures and Algorithms; Database System" }
    ];

    let marks = [
      { year: "2022", sem: "1", code: "ACEN340535E", name: "Academic English 1", credits: 4, score10: 7.3, score4: 3.0, letter: "B", result: "Đạt", note: "" },
      { year: "2022", sem: "1", code: "MATH132401E", name: "Calculus I", credits: 3, score10: 6.5, score4: 2.5, letter: "C+", result: "Đạt", note: "" },
      { year: "2022", sem: "1", code: "INPR130285E", name: "Introduction to Programming", credits: 3, score10: 8.3, score4: 3.5, letter: "B+", result: "Đạt", note: "" },
      { year: "2023", sem: "1", code: "DBSY230184E", name: "Database System", credits: 3, score10: 4.7, score4: 0, letter: "F", result: "Không đạt", note: "Lần học 1" },
      { year: "2023", sem: "2", code: "DBSY230184E", name: "Database System", credits: 3, score10: 6.0, score4: 2.0, letter: "C", result: "Đạt", note: "Học lại" },
      { year: "2026", sem: "2", code: "ETHA332080E", name: "Ethical Hacking (2+1)", credits: 3, score10: "", score4: "", letter: "", result: "Đang học", note: "" }
    ];

    const routes = {
      "/student": { title: "THÔNG BÁO", render: renderNotifications },
      "/student/info": { title: "THÔNG TIN SINH VIÊN", render: renderStudentInfo },
      "/student/studyprograms": { title: "CHƯƠNG TRÌNH ĐÀO TẠO", render: renderStudyProgram },
      "/student/marks": { title: "KẾT QUẢ HỌC TẬP", render: renderMarks },
      "/student/RegistScheduleUnit": { title: "ĐĂNG KÝ HỌC PHẦN", render: renderRegistration }
    };

    const api = {
      async get(path) {
        const response = await fetch(path, { headers: { "Accept": "application/json" } });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      },
      async post(path, body) {
        const response = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(body)
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
        return payload;
      }
    };

    function mapApiStudent(row) {
      if (!row) return { ...emptyStudent };
      return {
        id: row.MaSV || emptyStudent.id,
        name: row.HoTen || emptyStudent.name,
        type: row.LoaiNguoiHoc || "SV/HV/NCS",
        status: row.TrangThaiHienThi || row.TrangThaiSV || emptyStudent.status,
        major: row.TenNganh || emptyStudent.major,
        className: row.LopQuanLy || row.MaKhoaHoc || emptyStudent.className,
        program: row.TenCTDT || emptyStudent.program,
        programCode: row.MaCTDT || "",
        course: row.TenKhoaHoc || row.MaKhoaHoc || emptyStudent.course,
        birthDate: row.NgaySinh || "Chưa cập nhật",
        birthPlace: row.NoiSinh || "Chưa cập nhật",
        gender: row.GioiTinh || "Chưa cập nhật",
        citizenId: row.CCCDMasked || "Chưa cập nhật",
        ethnicity: row.DanToc || "Chưa cập nhật",
        religion: row.TonGiao || "Chưa cập nhật",
        phone: row.SoDienThoai || "Chưa cập nhật",
        email: row.Email || emptyStudent.email,
        address: row.DiaChi || "Chưa cập nhật",
        imageUrl: row.ImageUrl || "",
        emergencyContact: formatEmergencyContact(row.LienHe),
        gpa: row.GPA ?? emptyStudent.gpa,
        credits: row.TinChiTichLuy ?? emptyStudent.credits,
        requiredCredits: row.TongTinChiToiThieu ?? emptyStudent.requiredCredits,
        currentCredits: row.TinChiDangKyHienTai ?? emptyStudent.currentCredits,
        warning: row.CanhBaoHocVu || "",
        note: row.GhiChu || ""
      };
    }

    function formatEmergencyContact(contacts) {
      if (!Array.isArray(contacts) || contacts.length === 0) return emptyStudent.emergencyContact;
      const contact = contacts.find(item => item.LaLienHeKhanCap) || contacts[0];
      const phone = contact.SoDienThoai || "Chưa cập nhật";
      return `${contact.HoTen || "Liên hệ"} - ${phone}`;
    }

    function mapApiCurriculum(items) {
      return items.map((item, index) => {
        if (item.type !== "course") return item;
        return {
          type: "course",
          index: item.index || index + 1,
          group: item.group || "",
          requirement: item.requirement || item.LoaiYC || "Bắt buộc",
          code: item.code || item.MaMH || "",
          name: item.name || item.TenMH || "",
          electiveGroup: item.electiveGroup || item.TenNhomTC || "",
          credits: item.credits || item.SoTC || "",
          lectureHours: item.lectureHours || item.SoTietLT || "",
          practiceHours: item.practiceHours || item.SoTietTH || "",
          prerequisite: item.prerequisite || item.HocPhanTienQuyetText || "",
          prior: item.prior || item.HocPhanHocTruocText || "",
          equivalent: item.equivalent || item.HocPhanTuongDuongText || "",
          department: item.department || item.TenKhoaBM || "",
          outline: item.outline || ""
        };
      });
    }

    function mapApiMarks(items) {
      return items.map(item => ({
        year: String(item.year || ""),
        sem: String(item.semester || ""),
        code: item.code,
        name: item.name,
        credits: item.credits,
        score10: item.score10 ?? "",
        score4: item.score4 ?? "",
        letter: item.letter || "",
        result: item.result === "KHONG_DAT" ? "Không đạt" : item.result === "DANG_HOC" ? "Đang học" : "Đạt",
        note: displayMarkNote(item.note)
      }));
    }

    function displayMarkNote(note) {
      const value = note || "";
      const hiddenNotes = ["Nhập từ bảng KetQua tổng hợp", "Đăng ký hiện tại"];
      return hiddenNotes.includes(value)
        || value.startsWith("Bổ sung kết quả học lại đạt để cân bằng dữ liệu nợ môn v3")
        ? ""
        : value;
    }

    async function loadPortalData() {
      if (!isLoggedIn()) return;
      const maSv = sessionStorage.portalStudentId || student.id;
      try {
        const [studentPayload, notificationPayload, curriculumPayload, marksPayload] = await Promise.all([
          api.get(`/api/student?ma_sv=${encodeURIComponent(maSv)}`),
          api.get("/api/notifications"),
          api.get("/api/curriculum"),
          api.get(`/api/marks?ma_sv=${encodeURIComponent(maSv)}`)
        ]);
        if (studentPayload.student) {
          student = mapApiStudent(studentPayload.student);
          sessionStorage.portalStudent = JSON.stringify(student);
          sessionStorage.portalStudentId = student.id;
        }
        notifications = Array.isArray(notificationPayload.items) ? notificationPayload.items : [];
        curriculumRows = mapApiCurriculum(curriculumPayload.items || curriculumRows);
        marks = mapApiMarks(marksPayload.items || marks);
      } catch (error) {
        const cached = sessionStorage.portalStudent;
        if (cached) student = JSON.parse(cached);
      }
    }

    function route() {
      return location.hash.replace("#", "") || (sessionStorage.portalLoggedIn ? "/student" : "/login");
    }

    function navigate(path) {
      location.hash = path;
    }

    function isLoggedIn() {
      return sessionStorage.portalLoggedIn === "1";
    }

    async function render() {
      const current = route();
      if (current === "/login" || !isLoggedIn()) {
        renderLogin();
        return;
      }
      await loadPortalData();
      renderShell(current);
    }

    function googleLogo() {
      return `
        <svg class="google-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.92h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.41Z"/>
          <path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.36l-3.24-2.54c-.9.6-2.05.96-3.38.96-2.6 0-4.81-1.76-5.6-4.13H3.06v2.62A10 10 0 0 0 12 22Z"/>
          <path fill="#FBBC05" d="M6.4 13.93A6.02 6.02 0 0 1 6.09 12c0-.67.11-1.32.31-1.93V7.45H3.06A10 10 0 0 0 2 12c0 1.61.38 3.14 1.06 4.55l3.34-2.62Z"/>
          <path fill="#EA4335" d="M12 5.94c1.47 0 2.79.5 3.83 1.5l2.87-2.87A9.62 9.62 0 0 0 12 2a10 10 0 0 0-8.94 5.45l3.34 2.62C7.19 7.7 9.4 5.94 12 5.94Z"/>
        </svg>`;
    }

    function renderLogin() {
      document.getElementById("app").innerHTML = `
        <main class="login-page">
          <section class="login-brand" aria-label="HCMUTE">
            <img class="brand-logo-img" src="assets/ute_logo.png" alt="HCMUTE">
            <p>Trường Đại học Công nghệ Kỹ thuật TP.HCM</p>
          </section>
          <form class="login-card" id="loginForm">
            <h2>Đăng nhập</h2>
            <p class="subtitle">Cổng thông tin đào tạo</p>
            <div class="login-error" id="loginError">Sai tài khoản hoặc mật khẩu.</div>
            <div class="field">
              <label for="username">Tên đăng nhập</label>
              <input id="username" autocomplete="username" placeholder="Nhập mã số sinh viên">
            </div>
            <div class="field">
              <label for="password">Mật khẩu</label>
              <input id="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu">
            </div>
            <button class="portal-button" type="submit">Đăng nhập</button>
          </form>
          <footer class="login-footer">All Rights Reserved Developed by PSC</footer>
        </main>
      `;
      document.getElementById("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        try {
          const payload = await api.post("/api/login", { username, password });
          if (!payload.ok || !payload.student) throw new Error(payload.error || "LOGIN_FAILED");
          student = mapApiStudent(payload.student);
          sessionStorage.portalLoggedIn = "1";
          sessionStorage.portalStudentId = student.id;
          sessionStorage.portalStudent = JSON.stringify(student);
          navigate("/student");
          return;
        } catch (error) {}
        document.getElementById("loginError").style.display = "block";
      });
    }

    function renderShell(current) {
      const page = routes[current] || routes["/student"];
      document.getElementById("app").innerHTML = `
        <div class="portal-shell">
          ${renderSidebar(current)}
          <header class="student-header">
            <div>
              <button class="drawer-toggle" id="drawerToggle" aria-label="Mở menu">☰</button>
              <h1 style="display:inline-block">TRƯỜNG ĐẠI HỌC CÔNG NGHỆ KỸ THUẬT TP.HCM</h1>
            </div>
            <div class="header-actions">
              <span class="flag" aria-label="Việt Nam">★</span>
              <button class="header-avatar" id="logoutButton" title="Đăng xuất" aria-label="Đăng xuất"></button>
            </div>
          </header>
          <main class="main-content">
            ${renderRibbon(page.title)}
            <section id="pageContent">${page.render()}</section>
          </main>
          ${renderAgent()}
        </div>
      `;
      bindShellEvents();
      bindPageEvents(current);
      bindAgentEvents();
    }

    function renderSidebar(current) {
      const item = (path, icon, label) => `
        <a class="nav-link ${current === path ? "active" : ""}" href="#${path}" ${current === path ? 'aria-current="page"' : ""}>
          <span class="icon">${icon}</span><span>${label}</span>
        </a>`;
      return `
        <aside class="sidebar" id="sidebar">
          <a class="sidebar-logo" href="#/student" aria-label="Trang chủ sinh viên">
            <img class="brand-logo-img" src="assets/ute_logo.png" alt="HCMUTE">
          </a>
          <div class="student-summary">
            <div class="avatar" role="img" aria-label="Ảnh sinh viên"></div>
            <div class="name">${student.name}</div>
            <div class="meta">${student.type} - ${student.id}<br>(${student.status})</div>
          </div>
          <nav>
            <div class="nav-group">
              <div class="nav-heading">Trang cá nhân</div>
              ${item("/student/info", "▣", "Thông tin cá nhân")}
            </div>
            <div class="nav-group">
              <div class="nav-heading">Tra cứu thông tin</div>
              ${item("/student/studyprograms", "▦", "Chương trình đào tạo")}
              ${item("/student/marks", "▤", "Xem điểm")}
            </div>
            <div class="nav-group">
              <div class="nav-heading">Chức năng trực tuyến</div>
              ${item("/student/RegistScheduleUnit", "▥", "Đăng ký học phần")}
            </div>
          </nav>
        </aside>`;
    }

    function renderRibbon(title) {
      return `<div class="ribbon"><div class="ribbon-title">${title}</div><div class="ribbon-line"></div></div>`;
    }

    function renderNotifications() {
      return `
        <section class="panel">
          <div class="panel-body">
            <div class="tabs">
              <button class="tab ${activeNotificationTab === "general" ? "active" : ""}" data-tab="general">THÔNG BÁO CHUNG</button>
              <button class="tab ${activeNotificationTab === "personal" ? "active" : ""}" data-tab="personal">THÔNG BÁO CÁ NHÂN</button>
            </div>
            <div class="toolbar">
              <div class="search-input"><input id="notificationSearch" placeholder="Tìm kiếm thông báo"></div>
            </div>
            <div class="table-wrap">
              <table aria-label="Danh sách thông báo">
                <thead><tr><th>Tiêu đề</th><th>Người gửi</th><th>Thời gian gửi</th></tr></thead>
                <tbody id="notificationRows">${notificationRows(notificationItemsForTab(activeNotificationTab))}</tbody>
              </table>
            </div>
          </div>
        </section>`;
    }

    function notificationRows(rows) {
      if (!rows.length) {
        return `<tr><td colspan="3" class="center empty-notification">Hiện tại chưa có thông báo</td></tr>`;
      }
      return rows.map(row => `
        <tr>
          <td><a class="link" href="#">${row.title}</a></td>
          <td>${row.sender}</td>
          <td class="center">${row.time}</td>
        </tr>`).join("");
    }

    function notificationItemsForTab(tab) {
      return notifications.filter(item => (item.type || "general") === tab);
    }

    function studentAcademicYears() {
      return [...new Set(marks.map(row => row.year))]
        .sort((left, right) => Number(left) - Number(right));
    }

    function studentSemesters(year) {
      return [...new Set(
        marks.filter(row => row.year === year).map(row => row.sem)
      )].sort((left, right) => Number(left) - Number(right));
    }

    function studentAcademicChart(year, semester) {
      const semesterMarks = marks.filter(row =>
        row.year === year &&
        row.sem === semester &&
        row.result !== "Đang học" &&
        Number.isFinite(Number(row.score10))
      );
      if (!semesterMarks.length) {
        return `<div class="academic-chart-empty">Chưa có kết quả học tập trong học kỳ này</div>`;
      }

      const average10 = weightedAverage(semesterMarks, "score10");
      const average4 = weightedAverage(semesterMarks, "score4");
      const bars = semesterMarks.map(row => {
        const score = Number(row.score10);
        const barHeight = Math.max(2, Math.min(100, score * 10));
        return `
          <div class="academic-bar-item" title="${row.name}: ${score.toFixed(1)} điểm">
            <span class="academic-score">${score.toFixed(1)}</span>
            <span class="academic-bar-column" style="height:${barHeight}%"></span>
          </div>`;
      }).join("");
      const averagePosition = average10 === null ? 0 : Math.max(0, Math.min(100, average10 * 10));

      return `
        <div class="academic-chart-summary">
          <span>Điểm TB hệ 10: <strong>${formatAverage(average10)}</strong></span>
          <span>Điểm TB hệ 4: <strong>${formatAverage(average4)}</strong></span>
        </div>
        <div class="academic-chart" aria-label="Biểu đồ kết quả học tập ${formatAcademicYear(year)}, học kỳ ${semester}">
          <div class="academic-average-line" style="bottom:${averagePosition}%">
            <span>TB ${formatAverage(average10)}</span>
          </div>
          ${bars}
        </div>
        <div class="academic-chart-legend">
          <span><i class="legend-line"></i>Điểm trung bình học kỳ</span>
          <span><i class="legend-bar"></i>Điểm của bạn</span>
        </div>`;
    }

    function renderStudentInfo() {
      const years = studentAcademicYears();
      const selectedYear = years[0] || "2022";
      const semesters = studentSemesters(selectedYear);
      const selectedSemester = semesters[0] || "1";
      const completedCredits = Math.max(0, Number(student.credits) || 0);
      const totalCredits = Math.max(0, Number(student.requiredCredits) || completedCredits);
      const remainingCredits = Math.max(0, totalCredits - completedCredits);
      const completedPercent = totalCredits
        ? Math.min(100, completedCredits * 100 / totalCredits)
        : 0;
      const completedDegrees = completedPercent * 3.6;
      const yearOptions = (years.length ? years : [selectedYear])
        .map(year => `<option value="${year}">${formatAcademicYear(year)}</option>`)
        .join("");
      const semesterOptions = (semesters.length ? semesters : [selectedSemester])
        .map(semester => `<option value="${semester}">Học kỳ ${semester}</option>`)
        .join("");
      return `
        <div class="toolbar academic-toolbar">
          <label>Chương trình đào tạo</label><select><option>${student.program}</option></select>
          <label>Năm học</label><select id="infoYear">${yearOptions}</select>
          <label>Học kỳ</label><select id="infoSemester">${semesterOptions}</select>
        </div>
        <section class="student-grid">
          <div class="panel avatar-panel">
            <div class="avatar"></div>
            <div class="student-name">${student.name}</div>
            <div>${student.type} - ${student.id}</div>
            <button class="portal-button secondary" style="margin-top:10px">Read only</button>
          </div>
          <div class="panel chart-box">
            <div class="panel-header">Kết quả học tập</div>
            <div id="studentAcademicChart">${studentAcademicChart(selectedYear, selectedSemester)}</div>
          </div>
          <div class="panel chart-box progress-chart-box">
            <div class="study-progress-title">
              <div class="panel-header">Tiến độ học tập</div>
              <p>Tổng số tín chỉ: <strong>${completedCredits}/${totalCredits}</strong></p>
            </div>
            <div class="study-progress-content">
              <div class="study-progress-legend">
                <span><i class="progress-completed"></i>Đã học: <b>${completedCredits}</b></span>
                <span><i class="progress-remaining"></i>Còn lại: <b>${remainingCredits}</b></span>
              </div>
              <div
                class="study-progress-pie"
                style="--completed-degrees:${completedDegrees}deg"
                role="img"
                aria-label="Đã hoàn thành ${completedPercent.toFixed(1)} phần trăm chương trình"
              >
                <div class="study-progress-center">
                  <strong>${completedPercent.toFixed(1)}%</strong>
                  <span>hoàn thành</span>
                </div>
              </div>
            </div>
            <p class="current-registration">Đăng ký hiện tại: <strong>${student.currentCredits}</strong> tín chỉ</p>
          </div>
          <div class="panel info-panel">
            <div class="panel-header">Thông tin cơ bản</div>
            ${infoRow("Mã sinh viên", student.id)}
            ${infoRow("Họ tên", student.name)}
            ${infoRow("Ngày sinh", student.birthDate)}
            ${infoRow("Nơi sinh", student.birthPlace)}
            ${infoRow("Giới tính", student.gender)}
            ${infoRow("CMND/CCCD", student.citizenId)}
            ${infoRow("Dân tộc", student.ethnicity)}
            ${infoRow("Tôn giáo", student.religion)}
            ${infoRow("Lớp sinh viên", student.className)}
          </div>
          <div class="panel info-panel">
            <div class="panel-header">Thông tin liên hệ</div>
            ${infoRow("Email", student.email)}
            ${infoRow("Điện thoại", student.phone)}
            ${infoRow("Địa chỉ", student.address)}
            ${infoRow("Liên hệ khẩn cấp", student.emergencyContact)}
          </div>
          <div class="panel info-panel">
            <div class="panel-header">Thông tin nhập học</div>
            ${infoRow("Ngành", student.major)}
            ${infoRow("Khóa học", student.course)}
            ${infoRow("Trạng thái", student.status)}
            ${infoRow("Chương trình", student.program)}
          </div>
        </section>`;
    }

    function infoRow(label, value) {
      return `<div class="row"><div class="label">${label}</div><div class="value">${value}</div></div>`;
    }

    function renderStudyProgram() {
      return `
        <div class="toolbar">
          <label>Chương trình đào tạo</label><select><option>${student.program}</option></select>
        </div>
        ${curriculumTable()}`;
    }

    function curriculumTable() {
      const hasStructuredRows = curriculumRows.some(row => row.type && row.type !== "course");
      const rows = hasStructuredRows
        ? curriculumRows.map((row, index) => {
            if (row.type === "group") return `<tr class="group-pink"><td colspan="11">${row.label}</td></tr>`;
            if (row.type === "requirement") return `<tr class="group-blue"><td colspan="11">${row.label}</td></tr>`;
            return courseRow(row, index);
          })
        : [
            `<tr class="group-pink"><td colspan="11">Chưa phân học kỳ</td></tr>`,
            `<tr class="group-blue"><td colspan="11">Bắt buộc</td></tr>`,
            ...curriculumRows.filter(r => r.type === "Bắt buộc" || r.requirement === "Bắt buộc").map(courseRow),
            `<tr class="group-blue"><td colspan="11">Tự chọn</td></tr>`,
            ...curriculumRows.filter(r => r.type === "Tự chọn" || r.requirement === "Tự chọn").map(courseRow)
          ];
      const body = rows.join("");
      return `
        <div class="table-wrap">
          <table class="curriculum-table" aria-label="Chương trình đào tạo">
            <thead>
              <tr>
                <th rowspan="2">STT</th><th rowspan="2">Mã học phần</th><th rowspan="2">Tên học phần</th>
                <th rowspan="2">Nhóm tự chọn</th><th rowspan="2">Số TC</th><th colspan="2">Số tiết</th>
                <th rowspan="2">Học phần tiên quyết</th><th rowspan="2">Học phần học trước</th>
                <th rowspan="2">Học phần tương đương</th><th class="department-column" rowspan="2">Khoa/Bộ môn</th>
              </tr>
              <tr><th>LT</th><th>TH</th></tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>`;
    }

    function courseRow(row, index) {
      const stt = row.index || index + 1;
      return `
        <tr data-term="${row.term}">
          <td class="center">${stt}</td>
          <td class="center">${row.code}</td>
          <td>${row.name}</td>
          <td class="center">${row.electiveGroup || ""}</td>
          <td class="center">${row.credits}</td>
          <td class="center">${row.lectureHours || ""}</td>
          <td class="center">${row.practiceHours || ""}</td>
          <td>${row.prerequisite || row.prereq || ""}</td>
          <td>${row.prior || ""}</td>
          <td>${row.equivalent || ""}</td>
          <td class="department-column">${row.department || "Công nghệ Thông tin"}</td>
        </tr>`;
    }

    function renderMarks() {
      const yearOptions = [...new Set(marks.map(row => row.year))]
        .map(year => `<option value="${year}">${formatAcademicYear(year)}</option>`)
        .join("");
      return `
        <div class="toolbar">
          <label>Chương trình đào tạo</label><select><option>${student.program}</option></select>
          <label>Năm học</label><select id="markYear"><option value="">Tất cả</option>${yearOptions}</select>
          <label>Học kỳ</label><select id="markSem"><option value="">Tất cả</option><option>1</option><option>2</option></select>
        </div>
        <div class="table-wrap">
          <table aria-label="Kết quả học tập">
            <thead>
              <tr><th>STT</th><th>Mã môn học</th><th>Tên môn học</th><th>Số TC</th><th>Điểm hệ 10</th><th>Điểm hệ 4</th><th>Điểm chữ</th><th>Kết quả</th><th>Ghi chú</th></tr>
            </thead>
            <tbody id="marksRows">${marksRows(marks)}</tbody>
          </table>
        </div>`;
    }

    function formatAcademicYear(year) {
      const startYear = Number(year);
      return Number.isInteger(startYear) ? `${startYear}-${startYear + 1}` : year;
    }

    function weightedAverage(rows, scoreKey) {
      const scoredRows = rows.filter(row =>
        row.result !== "Đang học" &&
        row.letter !== "P" &&
        Number.isFinite(Number(row[scoreKey])) &&
        Number(row.credits) > 0
      );
      const totalCredits = scoredRows.reduce((total, row) => total + Number(row.credits), 0);
      if (!totalCredits) return null;
      const weightedTotal = scoredRows.reduce(
        (total, row) => total + Number(row[scoreKey]) * Number(row.credits),
        0
      );
      return weightedTotal / totalCredits;
    }

    function accumulatedPassedRows(rows) {
      const bestPassedAttempt = new Map();
      rows.filter(row => row.result === "Đạt").forEach(row => {
        const current = bestPassedAttempt.get(row.code);
        if (!current || Number(row.score4) > Number(current.score4)) {
          bestPassedAttempt.set(row.code, row);
        }
      });
      return [...bestPassedAttempt.values()];
    }

    function formatAverage(value) {
      return value === null ? "Chưa có" : value.toFixed(2);
    }

    function semesterSummary(groupRows, cumulativeRows) {
      const passedRows = groupRows.filter(row => row.result === "Đạt");
      const passedCredits = passedRows.reduce((total, row) => total + Number(row.credits || 0), 0);
      const semesterAverage10 = weightedAverage(groupRows, "score10");
      const semesterAverage4 = weightedAverage(groupRows, "score4");
      const passedCumulativeRows = accumulatedPassedRows(cumulativeRows);
      const cumulativeCredits = passedCumulativeRows.reduce(
        (total, row) => total + Number(row.credits || 0),
        0
      );
      const cumulativeAverage10 = weightedAverage(passedCumulativeRows, "score10");
      const cumulativeAverage4 = weightedAverage(passedCumulativeRows, "score4");

      return `
        <tr class="summary-row">
          <td colspan="9">
            <div class="semester-summary">
              <div>
                <strong>Tổng kết học kỳ</strong>
                <span> - Số tín chỉ đạt học kỳ: <b>${passedCredits}</b></span>
                <span> - Điểm TB học kỳ (hệ 10): <b>${formatAverage(semesterAverage10)}</b></span>
                <span> - Điểm TB học kỳ (hệ 4): <b>${formatAverage(semesterAverage4)}</b></span>
              </div>
              <div>
                <strong>Kết quả tích lũy</strong>
                <span> - Tổng số tín chỉ tích lũy: <b>${cumulativeCredits}</b></span>
                <span> - Điểm TB tích lũy (hệ 10): <b>${formatAverage(cumulativeAverage10)}</b></span>
                <span> - Điểm TB tích lũy (hệ 4): <b>${formatAverage(cumulativeAverage4)}</b></span>
              </div>
            </div>
          </td>
        </tr>`;
    }

    function marksRows(rows) {
      let html = "";
      let rowNumber = 1;
      let displayedYear = "";
      const groupedRows = new Map();
      rows.forEach(row => {
        const key = `${row.year}-${row.sem}`;
        if (!groupedRows.has(key)) groupedRows.set(key, []);
        groupedRows.get(key).push(row);
      });

      const allGroupKeys = [...new Set(marks.map(row => `${row.year}-${row.sem}`))];
      groupedRows.forEach((groupRows, groupKey) => {
        const { year, sem } = groupRows[0];
        if (year !== displayedYear) {
          displayedYear = year;
          html += `<tr class="group-pink"><td colspan="9">Năm học ${formatAcademicYear(year)}</td></tr>`;
        }
        html += `<tr class="group-blue"><td colspan="9">Học kỳ ${sem}</td></tr>`;

        groupRows.forEach(row => {
          const failed = row.result === "Không đạt";
          const studying = row.result === "Đang học";
          const statusClass = failed ? "status-fail" : studying ? "status-pending" : "status-pass";
          const statusIcon = failed ? "✕" : studying ? "•" : "✓";
          html += `
            <tr class="${failed ? "failed-row" : ""}">
              <td class="center">${rowNumber++}</td>
              <td class="center">${row.code}</td>
              <td>${row.name}</td>
              <td class="center">${row.credits}</td>
              <td class="center">${row.score10}</td>
              <td class="center">${row.score4}</td>
              <td class="center">${row.letter}</td>
              <td class="center ${statusClass}">${statusIcon} ${row.result}</td>
              <td>${row.note}</td>
            </tr>`;
        });

        const groupIndex = allGroupKeys.indexOf(groupKey);
        const cumulativeRows = marks.filter(
          row => allGroupKeys.indexOf(`${row.year}-${row.sem}`) <= groupIndex
        );
        html += semesterSummary(groupRows, cumulativeRows);
      });

      return html;
    }

    function renderRegistration() {
      return `
        <div class="toolbar">
          <label>Chương trình đào tạo</label><select><option>${student.program}</option></select>
        </div>
        ${curriculumTable()}
        <p class="agent-hint">Nhấn biểu tượng trợ lý ở góc dưới bên phải để hỏi về các học phần có thể đăng ký.</p>`;
    }

    function renderAgent() {
      const open = sessionStorage.agentOpen === "1";
      return `
        <section class="agent-panel ${open ? "" : "hidden"}" id="agentPanel" aria-label="Trợ lý đăng ký học phần">
          <div class="agent-header"><span>🤖 Trợ lý đăng ký học phần</span><button id="agentClose" aria-label="Đóng trợ lý">×</button></div>
          <div class="agent-messages" id="agentMessages">
            <div class="message assistant">Xin chào. Bạn có thể hỏi tôi về chương trình đào tạo, kết quả học tập và các học phần phù hợp để đăng ký.</div>
          </div>
          <div class="suggestions">
            <button type="button">Tôi còn thiếu những môn bắt buộc nào?</button>
            <button type="button">Các môn nào tôi đã rớt và cần học lại?</button>
            <button type="button">Liệt kê các môn tự chọn tôi chưa học.</button>
          </div>
          <form class="agent-composer" id="agentForm">
            <textarea id="agentInput" placeholder="Nhập câu hỏi về đăng ký học phần..."></textarea>
            <button type="submit">Gửi</button>
          </form>
        </section>
        <button class="floating-agent" id="agentToggle" aria-label="Mở trợ lý đăng ký học phần">🤖</button>`;
    }

    function bindShellEvents() {
      document.getElementById("logoutButton")?.addEventListener("click", () => {
        sessionStorage.removeItem("portalLoggedIn");
        navigate("/login");
      });
      document.getElementById("drawerToggle")?.addEventListener("click", () => {
        document.getElementById("sidebar")?.classList.toggle("open");
      });
    }

    function bindPageEvents(current) {
      if (current === "/student") {
        const input = document.getElementById("notificationSearch");
        const renderNotificationRows = () => {
          const q = input?.value.trim().toLowerCase() || "";
          const rows = notificationItemsForTab(activeNotificationTab).filter(item =>
            !q || item.title.toLowerCase().includes(q)
          );
          document.getElementById("notificationRows").innerHTML = notificationRows(rows);
        };
        input?.addEventListener("input", renderNotificationRows);
        document.querySelectorAll(".tab[data-tab]").forEach(tab => {
          tab.addEventListener("click", () => {
            activeNotificationTab = tab.dataset.tab;
            document.querySelectorAll(".tab[data-tab]").forEach(item => {
              item.classList.toggle("active", item === tab);
            });
            if (input) input.value = "";
            renderNotificationRows();
          });
        });
      }
      if (current === "/student/studyprograms") {
        document.getElementById("termFilter")?.addEventListener("change", (event) => {
          const value = event.target.value;
          document.querySelectorAll("[data-term]").forEach(row => {
            row.classList.toggle("hidden", value && row.dataset.term !== value);
          });
        });
      }
      if (current === "/student/info") {
        const yearSelect = document.getElementById("infoYear");
        const semesterSelect = document.getElementById("infoSemester");
        const updateAcademicChart = () => {
          document.getElementById("studentAcademicChart").innerHTML =
            studentAcademicChart(yearSelect.value, semesterSelect.value);
        };
        yearSelect?.addEventListener("change", () => {
          const semesters = studentSemesters(yearSelect.value);
          semesterSelect.innerHTML = semesters
            .map(semester => `<option value="${semester}">Học kỳ ${semester}</option>`)
            .join("");
          updateAcademicChart();
        });
        semesterSelect?.addEventListener("change", updateAcademicChart);
      }
      if (current === "/student/marks") {
        const filter = () => {
          const y = document.getElementById("markYear").value;
          const s = document.getElementById("markSem").value;
          const rows = marks.filter(row => (!y || row.year === y) && (!s || row.sem === s));
          document.getElementById("marksRows").innerHTML = rows.length ? marksRows(rows) : `<tr><td colspan="9" class="center">Không có kết quả học tập phù hợp với bộ lọc.</td></tr>`;
        };
        document.getElementById("markYear")?.addEventListener("change", filter);
        document.getElementById("markSem")?.addEventListener("change", filter);
      }
    }

    function bindAgentEvents() {
      document.getElementById("agentToggle")?.addEventListener("click", () => {
        const panel = document.getElementById("agentPanel");
        panel.classList.toggle("hidden");
        sessionStorage.agentOpen = panel.classList.contains("hidden") ? "0" : "1";
      });
      document.getElementById("agentClose")?.addEventListener("click", () => {
        document.getElementById("agentPanel").classList.add("hidden");
        sessionStorage.agentOpen = "0";
      });
      document.querySelectorAll(".suggestions button").forEach(button => {
        button.addEventListener("click", () => sendAgentMessage(button.textContent));
      });
      document.getElementById("agentForm")?.addEventListener("submit", (event) => {
        event.preventDefault();
        const input = document.getElementById("agentInput");
        const value = input.value.trim();
        if (!value) return;
        input.value = "";
        sendAgentMessage(value);
      });
      document.getElementById("agentInput")?.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          document.getElementById("agentForm").requestSubmit();
        }
      });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          document.getElementById("agentPanel")?.classList.add("hidden");
          sessionStorage.agentOpen = "0";
        }
      }, { once: true });
    }

    async function sendAgentMessage(text) {
      const box = document.getElementById("agentMessages");
      box.insertAdjacentHTML("beforeend", `<div class="message user">${escapeHtml(text)}</div>`);
      const loadingId = `agentLoading_${Date.now()}`;
      box.insertAdjacentHTML("beforeend", `<div class="message assistant" id="${loadingId}">Dang phan tich cau hoi...</div>`);
      box.scrollTop = box.scrollHeight;

      try {
        const payload = await api.post("/api/chat", { question: text, student_id: student.id });
        document.getElementById(loadingId)?.remove();
        const answer = escapeHtml(payload.answer || "Khong co phan hoi.");
        const warning = payload.parser_warning ? `<div class="agent-warning">${escapeHtml(payload.parser_warning)}</div>` : "";
        const source = payload.parser_source ? `<div class="agent-meta">Parser: ${escapeHtml(payload.parser_source)}</div>` : "";
        const table = agentRowsTable(payload.rows || []);
        box.insertAdjacentHTML("beforeend", `<div class="message assistant">${answer}${warning}${source}${table}</div>`);
      } catch (error) {
        document.getElementById(loadingId)?.remove();
        box.insertAdjacentHTML("beforeend", `<div class="message assistant">Khong the goi tro ly AI: ${escapeHtml(error.message || String(error))}</div>`);
      }

      box.scrollTop = box.scrollHeight;
    }

    function agentRowsTable(rows) {
      if (!Array.isArray(rows) || rows.length === 0) return "";
      const preferred = [
        "MaLHP", "MaMH", "TenMH", "Nhom",
        "ThuText", "TietText", "Buoi", "MaPhong", "TenGV",
        "SoChoCon", "TrangThaiLHP",
        "MaSV", "HoTen", "KetQua", "DiemTongKet", "DiemChu",
        "NamHoc", "HocKy", "LyDoKhongDangKy", "CoTheDangKy"
      ];
      const keys = Object.keys(rows[0]);
      const headers = preferred.filter(key => keys.includes(key));
      for (const key of keys) {
        if (!headers.includes(key) && headers.length < 10) headers.push(key);
      }
      const limitedRows = rows.slice(0, 8).map(row => headers.map(header => row[header] ?? ""));
      return agentTable(headers, limitedRows);
    }

    function agentTable(headers, rows) {
      return `<div class="table-wrap" style="margin-top:6px"><table aria-label="Ket qua tro ly"><thead><tr>${headers.map(h => `<th>${escapeHtml(String(h))}</th>`).join("")}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(String(cell))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
